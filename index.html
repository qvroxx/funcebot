<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolyo</title>
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #16191e;
            --card-hover: #1f232b;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #3b82f6;
            --border-color: #262a33;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Profil Kartı */
        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .profile-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .profile-info p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* Bölüm Başlığı */
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-left: 4px;
        }

        /* Bağlantılar Grid Yapısı */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        .link-card:hover {
            background-color: var(--card-hover);
            border-color: #374151;
            transform: translateY(-2px);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .link-icon {
            font-size: 1.25rem;
            color: var(--text-muted);
            width: 24px;
            text-align: center;
        }

        .link-text .title {
            font-weight: 600;
            font-size: 1rem;
        }

        .link-text .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .arrow-icon {
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: transform 0.2s ease;
        }

        .link-card:hover .arrow-icon {
            transform: translateX(4px);
            color: var(--text-color);
        }

        /* Footer */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Üst Profil Alanı -->
        <div class="profile-card">
            <img src="https://via.placeholder.com/150" alt="Profil Fotoğrafı" class="profile-avatar">
            <div class="profile-info">
                <h1>Kullanıcı Adı</h1>
                <p>Geliştirici & Tasarımcı. Web projeleri ve topluluk sistemleri üzerine çalışıyorum.</p>
            </div>
        </div>

        <!-- Bağlantılar Bölümü -->
        <div>
            <div class="section-title">Bağlantılar & Projeler</div>
            <div class="links-grid">
                
                <a href="https://github.com" target="_blank" class="link-card">
                    <div class="link-content">
                        <i class="fa-brands fa-github link-icon"></i>
                        <div class="link-text">
                            <div class="title">GitHub</div>
                            <div class="subtitle">Açık kaynak projelerim ve repolarım</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right arrow-icon"></i>
                </a>

                <a href="https://discord.com" target="_blank" class="link-card">
                    <div class="link-content">
                        <i class="fa-brands fa-discord link-icon"></i>
                        <div class="link-text">
                            <div class="title">Discord</div>
                            <div class="subtitle">Topluluk sunucuma katılın</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right arrow-icon"></i>
                </a>

                <a href="#" target="_blank" class="link-card">
                    <div class="link-content">
                        <i class="fa-solid fa-globe link-icon"></i>
                        <div class="link-text">
                            <div class="title">Örnek Proje</div>
                            <div class="subtitle">Canlı yayınlanan web projem</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right arrow-icon"></i>
                </a>

            </div>
        </div>

        <!-- Alt Bilgi -->
        <footer>
            <p>&copy; 2026 Tum haklari saklidir.</p>
        </footer>

    </div>

</body>
</html>
