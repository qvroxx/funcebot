
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sürpriz 😈</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #171717, #451010);
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    button {
      padding: 16px 35px;
      border: none;
      border-radius: 12px;
      background: #ff3030;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      background: #ff5050;
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    #result {
      font-size: clamp(35px, 9vw, 65px);
      color: #ff4545;
      font-weight: 900;
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="game">
      <h1 id="message">Butona tıkla 1/3</h1>
      <button onclick="tikla()">TIKLA 😈</button>
    </div>

    <div id="result" class="hidden">
      ENAYİ AZRA 😂
    </div>
  </div>

  <script>
    let sayac = 0;

    function tikla() {
      sayac++;

      if (sayac >= 3) {
        document.getElementById("game").classList.add("hidden");
        document.getElementById("result").classList.remove("hidden");
      } else {
        document.getElementById("message").textContent =
          `Butona tıkla ${sayac + 1}/3`;
      }
    }
  </script>
</body>
</html>
